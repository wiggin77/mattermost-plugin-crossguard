name: Post-Merge Validation

on:
  push:
    branches: [main]

jobs:
  wire-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Go tools
        run: make install-go-tools

      - name: Install webapp dependencies
        run: cd webapp && npm install

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Start Docker environment
        run: make docker-setup
        timeout-minutes: 5

      - name: Run integration tests with wire validation
        run: make docker-integration-test-validate-wire
        timeout-minutes: 20

      - name: Dump plugin logs
        if: always()
        run: |
          echo "=== Server A plugin logs ==="
          docker compose -f docker-compose.dev.yml logs mattermost-a 2>&1 | grep -i "crossguard\|plugin\|error\|panic" | tail -60 || true
          echo ""
          echo "=== Server B plugin logs ==="
          docker compose -f docker-compose.dev.yml logs mattermost-b 2>&1 | grep -i "crossguard\|plugin\|error\|panic" | tail -60 || true

      - name: Dump Service Bus stack logs
        if: always()
        run: |
          echo "=== servicebus-mssql logs ==="
          docker compose -f docker-compose.dev.yml --profile servicebus logs servicebus-mssql 2>&1 | tail -80 || true
          echo ""
          echo "=== servicebus-emulator logs ==="
          docker compose -f docker-compose.dev.yml --profile servicebus logs servicebus-emulator 2>&1 | tail -80 || true
          echo ""
          echo "=== servicebus-mssql container state ==="
          docker inspect mattermost-plugin-crossguard-servicebus-mssql-1 --format '{{json .State}}' 2>&1 | jq . 2>&1 || true
