# Mattermost Enterprise Edition for plugin development (dual-server)
services:
  postgres-a:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - ./docker/postgres-a-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-b:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - ./docker/postgres-b-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    ports:
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - ./docker/azurite-data:/data
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10001"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------
  # Azure Service Bus Emulator (Microsoft-supplied, requires SQL Server Linux)
  # ------------------------------------------------------------------------
  # Both servicebus-* services are under the `servicebus` compose profile so
  # they do NOT start with a plain `docker compose up`. SQL Server Linux is
  # finicky on CI runners (bind-mount permissions, cold startup time) and is
  # only needed for the Service Bus smoke test. Enable via the profile:
  #   docker compose --profile servicebus up -d servicebus-emulator
  # or `make docker-servicebus-up` (invoked automatically by
  # `make docker-servicebus-smoke-test`).
  #
  # The emulator binds port 5672 before its schema is ready, so there is no
  # reliable in-container healthcheck. Readiness is gated by the
  # `servicebus-probe` binary invoked from the smoke-test make target.
  servicebus-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    platform: linux/amd64
    profiles: [servicebus]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD:-CrossGuardDev!123}"
      MSSQL_PID: "Developer"
    volumes:
      # Named volume (not a bind mount) so Docker manages permissions.
      # SQL Server Linux runs as UID 10001 and refuses to start if
      # /var/opt/mssql is owned by another UID, which is what happens on
      # GitHub Actions runners where `mkdir -p ./docker/...` creates a
      # host directory owned by UID 1001.
      - servicebus-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.0.1
    platform: linux/amd64
    profiles: [servicebus]
    restart: unless-stopped
    depends_on:
      servicebus-mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-mssql
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD:-CrossGuardDev!123}"
      CONFIG_PATH: /ServiceBus_Emulator/ConfigFiles/Config.json
    volumes:
      # Source-of-truth config lives in build/ so it's tracked in git
      # (the entire docker/ tree is gitignored as runtime data).
      - ./build/servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_PORT:-5672}:5672"
    # No in-container healthcheck: rely on servicebus-probe instead (see
    # build/servicebus-probe/main.go and build/integration-tests.mk).
    healthcheck:
      disable: true

  mattermost-a:
    depends_on:
      postgres-a:
        condition: service_healthy
      nats:
        condition: service_healthy
    # The plugin's min_server_version requires features only present in
    # post-release builds of the server. Default to a CI image built from
    # master at a known-good commit (mattermostdevelopment/mm-ee-test:<sha>).
    # Override either part with MATTERMOST_IMAGE_REPO / MATTERMOST_IMAGE_TAG,
    # for example to target an official release like
    #   MATTERMOST_IMAGE_REPO=mattermost/mattermost-enterprise-edition
    #   MATTERMOST_IMAGE_TAG=11.7
    image: ${MATTERMOST_IMAGE_REPO:-mattermostdevelopment/mm-ee-test}:${MATTERMOST_IMAGE_TAG:-5504435}
    restart: unless-stopped
    ports:
      - "${MM_PORT_A:-8075}:8065"
    tmpfs:
      - /mattermost/config:uid=2000,gid=2000
      - /mattermost/logs:uid=2000,gid=2000
      - /mattermost/data:uid=2000,gid=2000
      - /mattermost/plugins:uid=2000,gid=2000,exec
      - /mattermost/client/plugins:uid=2000,gid=2000
    volumes:
      # Wire-envelope archive: host bind mount so the plugin's
      # outbound envelopes (visible via os.WriteFile from the plugin
      # process) are also visible to the test runner on the host.
      # Direct tmpfs mounts at this path ended up isolated from the
      # docker-host view, presumably by Mattermost plugin sandboxing.
      - ./docker/wire-archive-a:/mattermost/wire-archive:rw
    environment:
      TZ: UTC
      CROSSGUARD_ENVELOPE_ARCHIVE_DIR: /mattermost/wire-archive
      MM_CONFIG: postgres://mmuser:mmuser_password@postgres-a:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres-a:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://low.test:${MM_PORT_A:-8075}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      # Shared channels feature flags. The plugin's relay path calls the
      # shared channels framework, which is off by default. Set both the
      # new ConnectedWorkspacesSettings paths (authoritative on 11.x) and
      # the legacy ExperimentalSettings paths so older builds still work.
      MM_CONNECTEDWORKSPACESSETTINGS_ENABLESHAREDCHANNELS: "true"
      MM_CONNECTEDWORKSPACESSETTINGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_EXPERIMENTALSETTINGS_ENABLESHAREDCHANNELS: "true"
      MM_EXPERIMENTALSETTINGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_FEATUREFLAGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
      MM_LOGSETTINGS_ENABLEFILE: "false"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_ANNOUNCEMENTSETTINGS_ENABLEPREVIEWMODEBANNER: "false"

  mattermost-b:
    depends_on:
      postgres-b:
        condition: service_healthy
      nats:
        condition: service_healthy
    # The plugin's min_server_version requires features only present in
    # post-release builds of the server. Default to a CI image built from
    # master at a known-good commit (mattermostdevelopment/mm-ee-test:<sha>).
    # Override either part with MATTERMOST_IMAGE_REPO / MATTERMOST_IMAGE_TAG,
    # for example to target an official release like
    #   MATTERMOST_IMAGE_REPO=mattermost/mattermost-enterprise-edition
    #   MATTERMOST_IMAGE_TAG=11.7
    image: ${MATTERMOST_IMAGE_REPO:-mattermostdevelopment/mm-ee-test}:${MATTERMOST_IMAGE_TAG:-5504435}
    restart: unless-stopped
    ports:
      - "${MM_PORT_B:-8076}:8065"
    tmpfs:
      - /mattermost/config:uid=2000,gid=2000
      - /mattermost/logs:uid=2000,gid=2000
      - /mattermost/data:uid=2000,gid=2000
      - /mattermost/plugins:uid=2000,gid=2000,exec
      - /mattermost/client/plugins:uid=2000,gid=2000
    volumes:
      # Wire-envelope archive: see mattermost-a above for details.
      - ./docker/wire-archive-b:/mattermost/wire-archive:rw
    environment:
      TZ: UTC
      CROSSGUARD_ENVELOPE_ARCHIVE_DIR: /mattermost/wire-archive
      MM_CONFIG: postgres://mmuser:mmuser_password@postgres-b:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres-b:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://high.test:${MM_PORT_B:-8076}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      # Shared channels feature flags. The plugin's relay path calls the
      # shared channels framework, which is off by default. Set both the
      # new ConnectedWorkspacesSettings paths (authoritative on 11.x) and
      # the legacy ExperimentalSettings paths so older builds still work.
      MM_CONNECTEDWORKSPACESSETTINGS_ENABLESHAREDCHANNELS: "true"
      MM_CONNECTEDWORKSPACESSETTINGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_EXPERIMENTALSETTINGS_ENABLESHAREDCHANNELS: "true"
      MM_EXPERIMENTALSETTINGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_FEATUREFLAGS_ENABLEREMOTECLUSTERSERVICE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
      MM_LOGSETTINGS_ENABLEFILE: "false"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_ANNOUNCEMENTSETTINGS_ENABLEPREVIEWMODEBANNER: "false"

volumes:
  # Docker-managed named volume so SQL Server Linux (UID 10001) can
  # write its data files without host-permission workarounds.
  servicebus-mssql-data:

# Pin the bridge subnet to 192.168.77.0/24. Docker's default 172.16.0.0/12
# pool overlaps subnet routes that Tailscale peers commonly advertise (the
# AWS Mattermost dev hosts publish a 172.16.0.0/12 route), which makes the
# host-side route to the bridge lose to Tailscale's policy table. 192.168.77
# is not a typical home or office LAN range, so it stays out of the way.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.77.0/24
