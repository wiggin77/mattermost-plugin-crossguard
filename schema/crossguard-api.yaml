openapi: 3.1.0
info:
  title: Cross Guard Message API
  description: >
    Defines the message envelope, payload schemas, and connection
    configuration used by the Cross Guard plugin to relay events between
    Mattermost instances. Messages are transported over NATS, Azure
    Queue Storage, Azure Blob Storage (batched WAL), or Azure Service
    Bus, depending on the connection's `provider` setting. The wire
    format (JSON or XML) is controlled by the outbound connection's
    `message_format` setting. Inbound messages are auto-detected by
    inspecting the first non-whitespace byte (`<` means XML, `{` means
    JSON; a leading UTF-8 BOM on inbound XML is stripped before
    detection). JSON field names exactly mirror the XML element and
    attribute names defined in `crossguard.xsd`, so the two
    serializations are field-for-field equivalent.
  version: 1.2.0
  contact:
    name: Mattermost Federal

# These paths model logical message operations, not HTTP endpoints.
# NATS connections use pub/sub directly; Azure Queue connections use
# Queue Storage with polling-based delivery; Azure Blob connections
# batch messages into write-ahead log blobs that the inbound side
# polls, leases, and deletes.
paths:
  /publish:
    post:
      operationId: publishMessage
      summary: Publish a message to an outbound connection
      description: >
        Represents the act of publishing a Cross Guard message envelope to
        an outbound connection. For NATS, this publishes to the configured
        subject (e.g. `crossguard.high`). For Azure Queue Storage, the
        message is Base64-encoded and enqueued. For Azure Blob Storage,
        the message is appended to an in-memory WAL buffer that is
        periodically sealed and uploaded as a batch blob. For Azure
        Service Bus, the message is sent to the configured queue with
        PeekLock/Complete/Abandon delivery semantics. The transport is
        determined by the connection's `provider` setting. Only the
        `sync_msg` and `test` envelope types ride this path; the
        `attachment` and `profile_image` types are separate file-upload
        transfers (see `FileUploadHeaders`).
      x-nats-subject: "crossguard.{domain}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEnvelope"
          application/xml:
            schema:
              $ref: "#/components/schemas/MessageEnvelope"
      responses:
        "200":
          description: Message accepted by the transport provider.

  /subscribe:
    post:
      operationId: subscribeMessage
      summary: Receive a message from an inbound connection
      description: >
        Represents the receipt of a Cross Guard message envelope on an
        inbound connection. For NATS, messages arrive via subscription
        callback. For Azure Queue Storage, messages are dequeued via
        polling (configurable; default 5s). For Azure Blob Storage,
        batch WAL blobs are listed, leased, and processed message-by-
        message before the blob is deleted. For Azure Service Bus, the
        PeekLock receiver pulls up to 32 messages per batch (5s max
        wait) and Completes or Abandons each. The format (JSON or
        XML) is auto-detected on receipt regardless of provider. Only
        one node per cluster is the active receiver for a given
        inbound connection at a time (KV TTL lease); failover is
        automatic.
      x-nats-subject: "crossguard.{domain}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEnvelope"
          application/xml:
            schema:
              $ref: "#/components/schemas/MessageEnvelope"
      responses:
        "200":
          description: Message processed by the receiving plugin instance.

components:
  schemas:
    # ------------------------------------------------------------------
    # Envelope
    # ------------------------------------------------------------------
    MessageEnvelope:
      type: object
      description: >
        Envelope wrapping every `sync_msg` or `test` payload on the
        wire. JSON field names exactly mirror the XML element /
        attribute names defined in `crossguard.xsd`, so the two
        serializations are field-for-field equivalent. The outbound
        connection's `message_format` setting chooses the encoding;
        inbound is auto-detected from the first non-whitespace byte
        (`<` for XML, `{` for JSON; a leading UTF-8 BOM on XML is
        stripped before detection).


        Two of the four envelope types use this schema (`sync_msg`,
        `test`). The other two (`attachment`, `profile_image`) are not
        XML envelopes at all: they are raw file uploads through the
        transport's file-upload channel, with metadata travelling as
        `X-Crossguard-*` headers. See `FileUploadHeaders` below.


        XML serialization: `<CrossGuardEnvelope>` is the root element.
        `version` and `type` are XML attributes on the root; all other
        fields are child elements emitted in the order declared below.
      required:
        - version
        - type
        - ConnName
        - Timestamp
        - TeamName
        - ChannelName
      properties:
        version:
          type: integer
          description: Wire-format version (always 1 today). XML attribute on the root element.
          examples:
            - 1
        type:
          $ref: "#/components/schemas/MessageType"
        ConnName:
          type: string
          maxLength: 96
          description: >
            Outbound connection name on the sender. The receiver uses
            this to scope per-channel sequence numbers and to dispatch
            audit events. URL-safe slug, max 96 chars.
          examples:
            - "high-side"
        Timestamp:
          type: string
          format: date-time
          description: >
            UTC timestamp in RFC 3339 format indicating when the
            envelope was created. Defaults to `time.Now().UTC()` at
            marshal time when the caller leaves it empty.
          examples:
            - "2026-03-27T14:30:00Z"
        Epoch:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: >
            Sender's process generation ID. A 26-character Mattermost
            ID generated once at plugin activation, so the receiver
            can correlate sequence numbers across restarts. Stamped on
            every sender-originated envelope (both `sync_msg` and
            `test`).
        Sequence:
          type: integer
          format: int64
          minimum: 1
          description: >
            Per-`(ConnName, ChannelId)` monotonic counter within an
            epoch. Lets the receiver detect duplicates and reorder
            short gaps. Stamped on `sync_msg` envelopes only; absent
            on `test` envelopes (no channel scope).
        TeamName:
          type: string
          maxLength: 96
          description: >
            Sender's team name (URL-safe slug, max 96 chars). On
            `test` envelopes this carries the connection name as a
            placeholder so the field passes XSD validation; the
            receiver ignores team and channel scope for `type=test`.
        ChannelName:
          type: string
          maxLength: 96
          description: >
            Sender's channel name (URL-safe slug, max 96 chars). On
            `test` envelopes this carries the connection name as a
            placeholder.
        SyncMsg:
          $ref: "#/components/schemas/SyncMsg"
          description: >
            Present when `type` is `sync_msg`. Carries the shared-
            channels sync payload (at most one Post plus optional
            Users, Reactions, Statuses, MembershipChanges,
            Acknowledgements, MentionTransforms).
        TestID:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: >
            Present when `type` is `test`. A 26-character Mattermost
            ID generated by the test-connection handler; the receiver
            echoes it into its audit log.

    # ------------------------------------------------------------------
    # Envelope type discriminator
    # ------------------------------------------------------------------
    MessageType:
      type: string
      description: >
        Envelope type discriminator. The four constants are defined in
        `server/transport.go`. `sync_msg` and `test` ride the
        `<CrossGuardEnvelope>` XML envelope above; `attachment` and
        `profile_image` are raw file uploads with `X-Crossguard-Kind`
        headers (see `FileUploadHeaders`).
      enum:
        - sync_msg
        - test
        - attachment
        - profile_image
      x-enum-descriptions:
        sync_msg: Shared-channels sync payload. Carries at most one Post plus optional non-post content from the same sync cycle.
        test: Connectivity check. Carries a TestID and an Epoch; the receiver echoes both into audit logs.
        attachment: Raw file upload for a Post attachment. NOT an XML envelope; metadata travels as HTTP-style headers on the file blob.
        profile_image: Raw image upload for a synced user's avatar. NOT an XML envelope; metadata travels as headers.

    # ------------------------------------------------------------------
    # SyncMsg payload (carried inside sync_msg envelopes)
    # ------------------------------------------------------------------
    SyncMsg:
      type: object
      description: >
        Plugin-owned wire-pruned subset of `mmModel.SyncMsg`. The
        sender splits each upstream sync cycle into one envelope per
        Post plus an optional metadata envelope carrying only non-post
        content (orphan reactions, memberships, statuses, etc.) from
        that cycle. Containers (`Users`, `Reactions`, `Statuses`,
        `MembershipChanges`, `Acknowledgements`, `MentionTransforms`)
        are omitted entirely when empty; non-empty `Users` and
        `MentionTransforms` are sorted by key for deterministic
        output. Field order inside `<SyncMsg>` is fixed: Id, ChannelId,
        Users, Post, Reactions, Statuses, MembershipChanges,
        Acknowledgements, MentionTransforms.
      required:
        - Id
        - ChannelId
      properties:
        Id:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: Identifier for the sync cycle (upstream `SyncMsg.Id`).
        ChannelId:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: Source-side channel ID this sync cycle belongs to.
        Users:
          type: object
          description: >
            Users referenced by the contained Post, Reactions,
            Statuses, MembershipChanges, or Acknowledgements. Encoded
            in XML as `<User id="...">` children of `<Users>`; in JSON
            as a map keyed by user ID. Max 1000 entries.
          maxProperties: 1000
          additionalProperties:
            $ref: "#/components/schemas/User"
        Post:
          $ref: "#/components/schemas/Post"
          description: At most one Post per envelope. Absent on metadata envelopes.
        Reactions:
          type: array
          description: Reactions emitted in this sync cycle.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Reaction"
        Statuses:
          type: array
          description: Presence status snapshots emitted in this sync cycle.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Status"
        MembershipChanges:
          type: array
          description: Channel join and leave events emitted in this sync cycle.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MembershipChange"
        Acknowledgements:
          type: array
          description: Post acknowledgements emitted in this sync cycle.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PostAcknowledgement"
        MentionTransforms:
          type: object
          description: >
            Sender-resolved mention rewrites (e.g. `@alice` →
            `@alice.high`). Encoded in XML as `<Transform key="..."
            value="..."/>` children of `<MentionTransforms>`; in JSON
            as a map. Sorted by key for determinism. Max 1000 entries.
          maxProperties: 1000
          additionalProperties:
            type: string
            maxLength: 384

    # ------------------------------------------------------------------
    # Wire-type building blocks (referenced from SyncMsg)
    # ------------------------------------------------------------------
    Post:
      type: object
      description: >
        Wire-pruned subset of `mmModel.Post`. Source-side computed
        fields (`ReplyCount`, `LastReplyAt`, `Participants`,
        `IsFollowing`, `MessageSource`, `PendingPostId`) and
        receiver-overwritten fields (`Filenames`, `Metadata`) are
        dropped at the source.
      required:
        - Id
        - CreateAt
        - UpdateAt
        - DeleteAt
        - UserId
        - ChannelId
        - Message
      properties:
        Id: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        CreateAt:
          type: integer
          format: int64
          description: Unix milliseconds.
        UpdateAt: { type: integer, format: int64 }
        EditAt: { type: integer, format: int64 }
        DeleteAt: { type: integer, format: int64 }
        UserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        ChannelId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        RootId:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: ID of the root post if this is a threaded reply.
        OriginalId:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: ID of the post this is an edit of (set on edits).
        Message:
          type: string
          maxLength: 1048576
          description: Markdown-formatted post body. Max 1 MiB.
        Type:
          type: string
          maxLength: 96
          description: Post type. Empty for normal posts; `system_*` for system messages.
        Props:
          $ref: "#/components/schemas/PostProps"
        Hashtags:
          type: string
          maxLength: 1536
        FileIds:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9]{26}$"
            maxLength: 26
          description: >
            File attachment IDs. Each ID's bytes ride a separate
            `attachment` upload (raw bytes + headers), not the XML
            envelope.
        HasReactions: { type: boolean }
        RemoteId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        IsPinned: { type: boolean }

    PostProps:
      type: object
      description: >
        Whitelisted subset of `Post.Props`. Exactly fifteen keys are
        carried on the wire; any other upstream key is dropped at the
        boundary. `OverrideIconEmoji` has surrounding colons
        (`:emoji:`) stripped at marshal and re-added at unmarshal.
      properties:
        FromWebhook: { type: boolean }
        FromBot: { type: boolean }
        FromPlugin: { type: boolean }
        FromOAuthApp: { type: boolean }
        OverrideUsername: { type: string, maxLength: 192 }
        OverrideIconURL: { type: string, maxLength: 3072 }
        OverrideIconEmoji: { type: string, maxLength: 96 }
        WebhookDisplayName: { type: string, maxLength: 192 }
        AddedUserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        DeleteBy: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        AddChannelMember: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        MentionHighlightDisabled: { type: boolean }
        DisableGroupHighlight: { type: boolean }
        AIGeneratedByUserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        AIGeneratedByUsername: { type: string, maxLength: 96 }

    User:
      type: object
      description: >
        Wire-pruned subset of `mmModel.User`. Credential fields,
        notification preferences, and other source-local data are
        dropped at the boundary. `Username` runs a resolve-then-
        truncate ladder so colon-tagged remote usernames never reach
        the wire; the colon-bearing form is recovered from
        `Props.RemoteUsername` on the receiver when needed.
      required:
        - Id
        - DeleteAt
        - Username
        - Email
        - Roles
      properties:
        Id: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        CreateAt: { type: integer, format: int64 }
        UpdateAt: { type: integer, format: int64 }
        DeleteAt: { type: integer, format: int64 }
        Username:
          type: string
          pattern: "^[a-z0-9][a-z0-9_\\-\\.]{0,95}$"
          maxLength: 96
        Email:
          type: string
          format: email
          maxLength: 381
        Nickname: { type: string, maxLength: 192 }
        FirstName: { type: string, maxLength: 192 }
        LastName: { type: string, maxLength: 192 }
        Position: { type: string, maxLength: 1536 }
        Roles:
          type: string
          maxLength: 1536
          description: Space-separated Mattermost role names (e.g. `system_user system_admin`).
        Locale:
          type: string
          maxLength: 53
          description: BCP 47-shaped locale code.
        Timezone:
          type: object
          description: >
            Open string map (max 100 entries). Encoded in XML as
            `<Entry key="..." value="..."/>` children of `<Timezone>`;
            in JSON as a flat map. Sorted by key for determinism.
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 6144
        Props:
          $ref: "#/components/schemas/UserProps"
        RemoteId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        IsBot: { type: boolean }
        BotDescription: { type: string, maxLength: 1536 }
        BotLastIconUpdate: { type: integer, format: int64 }

    UserProps:
      type: object
      description: >
        Whitelisted subset of `User.Props`. Pattern-validated values
        (`RemoteUsername`, `RemoteEmail`) that fail validation are
        dropped at marshal with a Warn-level audit log; the user
        record itself is kept.
      properties:
        CustomStatus: { type: string, maxLength: 1536 }
        RemoteUsername:
          type: string
          pattern: "^[a-z0-9][a-z0-9_\\-\\.]{0,95}$"
          maxLength: 96
        RemoteEmail:
          type: string
          format: email
          maxLength: 381
        OriginalRemoteId:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26

    Reaction:
      type: object
      description: An emoji reaction on a post.
      required:
        - UserId
        - PostId
        - EmojiName
        - CreateAt
        - UpdateAt
        - DeleteAt
        - ChannelId
      properties:
        UserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        PostId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        EmojiName:
          type: string
          maxLength: 96
          description: Name of the emoji, without surrounding colons.
        CreateAt: { type: integer, format: int64 }
        UpdateAt: { type: integer, format: int64 }
        DeleteAt: { type: integer, format: int64 }
        RemoteId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        ChannelId:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: >
            Source-side channel ID. Back-filled from the parent
            `SyncMsg.ChannelId` when upstream omits it.

    Status:
      type: object
      description: >
        Presence snapshot. Source-local `ActiveChannel` is dropped at
        the boundary.
      required:
        - UserId
        - Status
        - Manual
        - LastActivityAt
        - DNDEndTime
      properties:
        UserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        Status:
          type: string
          enum: [online, away, dnd, offline]
        Manual: { type: boolean }
        LastActivityAt:
          type: integer
          format: int64
          description: Unix milliseconds.
        DNDEndTime:
          type: integer
          format: int64
          description: Unix seconds (upstream quirk preserved on the wire).

    MembershipChange:
      type: object
      description: A channel join or leave event.
      required:
        - ChannelId
        - UserId
        - IsAdd
        - ChangeTime
      properties:
        ChannelId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        UserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        IsAdd:
          type: boolean
          description: True for a join, false for a leave.
        RemoteId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        ChangeTime:
          type: integer
          format: int64
          description: Unix milliseconds.

    PostAcknowledgement:
      type: object
      description: A user's acknowledgement of a post.
      required:
        - UserId
        - PostId
        - AcknowledgedAt
        - ChannelId
      properties:
        UserId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        PostId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        AcknowledgedAt: { type: integer, format: int64 }
        ChannelId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }
        RemoteId: { type: string, pattern: "^[a-z0-9]{26}$", maxLength: 26 }

    # ------------------------------------------------------------------
    # File-upload metadata (carried as headers on attachment and
    # profile_image uploads; NOT part of the XML envelope schema)
    # ------------------------------------------------------------------
    FileUploadHeaders:
      type: object
      description: >
        Metadata carried as HTTP-style headers on `attachment` and
        `profile_image` file uploads. The transport routes the raw
        file bytes through `QueueProvider.UploadFile` (or its
        provider-specific equivalent: NATS JetStream Object Store
        headers, Azure Blob metadata, Azure Service Bus blob sidecar
        metadata). The receiver reads these headers from the
        corresponding `WatchFiles` event and reconstructs the file
        context. Header names are case-insensitive on the wire.
      required:
        - X-Crossguard-Kind
        - X-Conn-Name
        - X-Filename
      properties:
        X-Crossguard-Kind:
          type: string
          enum:
            - attachment
            - profile_image
          description: Discriminates the two file-upload kinds.
        X-Conn-Name:
          type: string
          maxLength: 96
          description: Outbound connection name on the sender.
        X-Filename:
          type: string
          description: Original filename. `profile.png` for profile images.
        X-Team-Name:
          type: string
          maxLength: 96
          description: Required on `attachment`.
        X-Channel-Name:
          type: string
          maxLength: 96
          description: Required on `attachment`.
        X-Post-Id:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: Required on `attachment`. The post the file belongs to.
        X-File-Info:
          type: string
          description: >
            Required on `attachment`. Base64-encoded JSON
            `mmModel.FileInfo`. Base64 wraps the JSON so it survives
            provider metadata-encoding rules (Azure Blob metadata is
            HTTP-header-grade, NATS object store uses `nats.Header`).
        X-User-Id:
          type: string
          pattern: "^[a-z0-9]{26}$"
          maxLength: 26
          description: Required on `profile_image`. The synced user.

    # ------------------------------------------------------------------
    # Connection configuration (stored in plugin settings, not on the wire)
    # ------------------------------------------------------------------
    ConnectionConfig:
      type: object
      description: >
        Configuration for a single connection (inbound or outbound).
        Stored in plugin settings as a JSON array. The `provider` field
        determines which nested configuration block is used. Exactly one
        of `nats`, `azure_queue`, `azure_blob`, or `azure_servicebus`
        should be present, matching the provider.
      required:
        - name
        - provider
      properties:
        name:
          type: string
          description: >
            Human-readable connection identifier. Lowercase alphanumeric
            characters and hyphens only.
          pattern: "^[a-z0-9-]+$"
          examples:
            - "high-side"
        site_url:
          type: string
          description: >
            Stable identity used to register the connection as a shared
            channels remote on the Mattermost server. Defaults to
            `crossguard:` + `name` on first save and is immutable
            thereafter so renames preserve the remote's identity and its
            sync cursor. Inbound and outbound connections that share a
            `site_url` are paired and share a single remote ID for loop
            prevention and synthetic-user tagging.
          examples:
            - "crossguard:high-side"
        provider:
          type: string
          enum:
            - nats
            - azure-queue
            - azure-blob
            - azure-servicebus
          description: >
            Transport provider for this connection. Determines which
            nested configuration block is used and how messages are
            delivered.
          default: "nats"
        file_transfer_enabled:
          type: boolean
          description: >
            Whether file attachment relay is enabled for this connection.
            For NATS, files are stored in a JetStream Object Store bucket.
            For Azure Queue, files are stored in an Azure Blob Storage
            container referenced by `azure_queue.blob_container_name`.
            For Azure Blob, files are stored as deferred file blobs in
            the same container referenced by
            `azure_blob.blob_container_name`. For Azure Service Bus,
            files flow through a separate Azure Blob Storage container
            configured with its own credentials on the
            `azure_servicebus` block (Service Bus queues are
            message-only).
          default: false
        file_filter_mode:
          type: string
          enum:
            - ""
            - allow
            - deny
          description: >
            File extension filter mode. Empty string means no filtering
            (all files pass). `allow` means only listed extensions are
            relayed. `deny` means listed extensions are blocked.
          default: ""
        file_filter_types:
          type: string
          description: >
            Comma-separated list of file extensions to filter (e.g.
            `.pdf,.docx,.png`). Extensions are case-insensitive and a
            leading dot is optional. Only meaningful when
            `file_filter_mode` is `allow` or `deny`.
          default: ""
          examples:
            - ".pdf,.docx,.png"
        message_format:
          type: string
          enum:
            - xml
            - json
          description: >
            Wire format for outbound messages. Defaults to `xml`, which
            is the format used by Cross Domain Solutions (CDS). Set to
            `json` to emit the same envelope content as JSON; the JSON
            shape is defined by `crossguard.schema.json` (a mechanical
            translation of `crossguard.xsd`). Empty resolves to `xml`.
            Inbound messages are auto-detected on the first
            non-whitespace byte (`<` selects XML, `{` selects JSON) and
            ignore this setting; only outbound connections consult it.
          default: "xml"
        nats:
          $ref: "#/components/schemas/NATSProviderConfig"
          description: >
            NATS provider configuration. Required when provider is `nats`.
        azure_queue:
          $ref: "#/components/schemas/AzureQueueProviderConfig"
          description: >
            Azure Queue Storage provider configuration. Required when
            provider is `azure-queue`.
        azure_blob:
          $ref: "#/components/schemas/AzureBlobProviderConfig"
          description: >
            Azure Blob Storage provider configuration. Required when
            provider is `azure-blob`.
        azure_servicebus:
          $ref: "#/components/schemas/AzureServiceBusProviderConfig"
          description: >
            Azure Service Bus provider configuration. Required when
            provider is `azure-servicebus`.

    # ------------------------------------------------------------------
    # NATS provider configuration
    # ------------------------------------------------------------------
    NATSProviderConfig:
      type: object
      description: >
        Configuration fields specific to the NATS transport provider.
        NATS uses push-based pub/sub delivery with optional JetStream
        for file transfer.
      required:
        - address
        - subject
      properties:
        address:
          type: string
          description: NATS server address.
          examples:
            - "nats://nats:4222"
        subject:
          type: string
          description: NATS subject to publish to or subscribe on. Must start with `crossguard.`.
          pattern: "^crossguard\\."
          examples:
            - "crossguard.high"
        tls_enabled:
          type: boolean
          description: Whether TLS is enabled for this connection.
          default: false
        auth_type:
          type: string
          enum:
            - none
            - token
            - credentials
          description: Authentication method for the NATS connection.
          default: "none"
        token:
          type: string
          description: Bearer token (used when auth_type is `token`).
        username:
          type: string
          description: Username (used when auth_type is `credentials`).
        password:
          type: string
          format: password
          description: Password (used when auth_type is `credentials`).
        client_cert:
          type: string
          description: Filesystem path to the client TLS certificate.
        client_key:
          type: string
          description: Filesystem path to the client TLS private key.
        ca_cert:
          type: string
          description: Filesystem path to the CA certificate for server verification.

    # ------------------------------------------------------------------
    # Azure provider configuration
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # Shared Service Principal fields (used by all three Azure providers
    # when auth_mode is "service-principal").
    # ------------------------------------------------------------------
    AzureServicePrincipalFields:
      type: object
      description: >
        Fields shared by all three Azure provider schemas for Azure AD
        Service Principal authentication. Required when `auth_mode` is
        `"service-principal"`. The corresponding legacy fields
        (`account_key`, `connection_string`) MUST be empty when SP mode
        is selected; server-side validation rejects the save otherwise.
      properties:
        auth_mode:
          type: string
          description: >
            Credential type discriminator. Empty defaults to the legacy
            mode for that provider (`shared-key` for Queue/Blob,
            `connection-string` for Service Bus).
          enum:
            - ""
            - shared-key
            - connection-string
            - service-principal
        azure_cloud:
          type: string
          description: >
            Azure cloud environment. Empty defaults to `public`. Drives
            the AAD authority host for credential acquisition and (for
            Queue/Blob) the data-plane SDK client options. Service Bus
            data-plane routing is determined by the FQDN namespace.
          enum:
            - ""
            - public
            - usgov
            - china
        tenant_id:
          type: string
          description: >
            Azure AD tenant (directory) ID. Accepts either a GUID or an
            FQDN-shaped domain (e.g., `contoso.onmicrosoft.com`).
            Required when `auth_mode` is `service-principal`.
          examples:
            - "11111111-2222-3333-4444-555555555555"
            - "contoso.onmicrosoft.com"
        client_id:
          type: string
          description: >
            Azure AD application (client) ID for the Service Principal.
            Required when `auth_mode` is `service-principal`.
        client_secret:
          type: string
          description: >
            Inline client secret value. Required when `auth_mode` is
            `service-principal`. Treat as a secret; never logged or
            exposed in admin status responses. The webapp form sends the
            sentinel string `__CROSSGUARD_SECRET_UNCHANGED__` for an
            unchanged value; the server resolves this back to the stored
            value before validation. An empty inbound value is honored
            as an explicit clear so admins can delete a stored secret.
            To keep the secret out of plugin config on disk, inject the
            whole connections JSON via the
            `MM_PLUGINSETTINGS_PLUGINS_CROSSGUARD_OUTBOUNDCONNECTIONS`
            (or inbound counterpart) env var; Mattermost substitutes
            plugin settings from env vars at config load.

    AzureQueueProviderConfig:
      type: object
      description: >
        Configuration fields specific to the Azure Queue Storage transport
        provider. Azure uses polling-based delivery with a 5-second poll
        interval for queue messages and 15-second poll interval for blob
        files. In shared-key auth mode (the legacy default) queues and
        blob containers are auto-created on startup if they do not
        exist. In service-principal auth mode auto-creation is SKIPPED:
        operators must pre-provision the queue and (optionally) blob
        container so the SP can run with data-plane-only RBAC (Storage
        Queue Data Contributor / Storage Blob Data Contributor).
      allOf:
        - $ref: "#/components/schemas/AzureServicePrincipalFields"
      required:
        - queue_service_url
        - queue_name
      properties:
        queue_service_url:
          type: string
          description: >
            Azure Queue Storage service URL. For production Azure, the
            standard form is `https://<account>.queue.core.windows.net`.
            For Azurite (local emulator), use
            `http://azurite:10001/devstoreaccount1`. For Azure US
            Government, use `*.queue.core.usgovcloudapi.net`.
          examples:
            - "https://myaccount.queue.core.windows.net"
        blob_service_url:
          type: string
          description: >
            Azure Blob Storage service URL. Required when
            `file_transfer_enabled` is true. For production Azure, the
            standard form is `https://<account>.blob.core.windows.net`.
          examples:
            - "https://myaccount.blob.core.windows.net"
        account_name:
          type: string
          description: >
            Azure Storage account name. Used with `account_key` to form a
            shared-key credential. Required in shared-key auth mode.
          examples:
            - "myaccount"
        account_key:
          type: string
          description: >
            Azure Storage account shared access key (base64). Treat as a
            secret. Required in shared-key auth mode. MUST be empty when
            `auth_mode` is `service-principal`.
        queue_name:
          type: string
          description: >
            Name of the Azure Queue. Auto-created on provider startup in
            shared-key mode; must be pre-provisioned in service-principal
            mode. Must follow Azure Queue naming rules (lowercase, 3-63
            characters, letters/numbers/hyphens).
          examples:
            - "crossguard-relay"
        blob_container_name:
          type: string
          description: >
            Name of the Azure Blob container for file transfer. Required
            when `file_transfer_enabled` is true. Auto-created on startup
            in shared-key mode; pre-provisioned in service-principal
            mode.
          examples:
            - "crossguard-files"
        poll_interval_seconds:
          type: integer
          description: >
            How often the inbound side polls the Azure Queue for new
            messages.
          minimum: 1
          default: 5
        blob_poll_interval_seconds:
          type: integer
          description: >
            How often the inbound side polls the blob container for new
            file attachments. Only applies when `file_transfer_enabled`
            is true.
          minimum: 1
          default: 15

    # ------------------------------------------------------------------
    # Azure Blob provider configuration
    # ------------------------------------------------------------------
    AzureBlobProviderConfig:
      type: object
      description: >
        Configuration fields specific to the Azure Blob Storage transport
        provider. This provider does not use Azure Queue Storage. The
        outbound side appends messages to an in-memory write-ahead log
        (WAL) and periodically seals and uploads the WAL as a single
        batch blob. The inbound side polls the container, takes a
        short-lived lease on each batch blob, processes it, and deletes
        it. File attachments are stored as deferred file blobs in the
        same container. In shared-key mode the container is auto-created
        on startup if it does not exist; in service-principal mode auto-
        creation is SKIPPED (pre-provision the container so the SP can
        run with Storage Blob Data Contributor only).
      allOf:
        - $ref: "#/components/schemas/AzureServicePrincipalFields"
      required:
        - service_url
        - blob_container_name
      properties:
        service_url:
          type: string
          description: >
            Azure Blob Storage service URL. For production Azure, the
            standard form is `https://<account>.blob.core.windows.net`.
            For Azurite (local emulator), use
            `http://azurite:10000/devstoreaccount1`. For Azure US
            Government, use `*.blob.core.usgovcloudapi.net`.
          examples:
            - "https://myaccount.blob.core.windows.net"
        account_name:
          type: string
          description: >
            Azure Storage account name. Used with `account_key` to form a
            shared-key credential. Required in shared-key auth mode.
          examples:
            - "myaccount"
        account_key:
          type: string
          description: >
            Azure Storage account shared access key (base64). Treat as a
            secret. Required in shared-key auth mode. MUST be empty when
            `auth_mode` is `service-principal`.
        blob_container_name:
          type: string
          description: >
            Name of the Azure Blob container that holds both batch WAL
            blobs and deferred file blobs. Auto-created on startup if it
            does not exist.
          examples:
            - "crossguard-wal"
        flush_interval_seconds:
          type: integer
          description: >
            How often the outbound side seals the current write-ahead
            log blob and uploads it. Lower values reduce end-to-end
            latency at the cost of more blob operations. Must be at
            least 5 when set.
          minimum: 5
          default: 60
        blob_lock_max_age_seconds:
          type: integer
          description: >
            Maximum age of a blob lease before the inbound side
            considers it stale and takes over processing. Prevents a
            crashed inbound node from stalling delivery. Must be at
            least 30 when set.
          minimum: 30
          default: 300
        batch_poll_interval_seconds:
          type: integer
          description: >
            How often the inbound side polls the container for new
            batch WAL blobs to process. Lower values reduce end-to-end
            latency at the cost of more list operations.
          minimum: 1
          default: 30

    # ------------------------------------------------------------------
    # Azure Service Bus provider configuration
    # ------------------------------------------------------------------
    AzureServiceBusProviderConfig:
      type: object
      description: >
        Configuration fields specific to the Azure Service Bus transport
        provider. Service Bus queues carry messages; file attachments
        (when `file_transfer_enabled` is true) flow through a separate
        Azure Blob Storage container configured below. The plugin does
        NOT auto-create queues; operators must pre-create the queue in
        Azure with the desired `LockDuration` and `MaxDeliveryCount`.
        Auth is via SAS connection string (legacy default) or Azure AD
        Service Principal. In service-principal mode the blob sidecar
        inherits the parent SP credential; `blob_account_name` and
        `blob_account_key` must be empty.
      allOf:
        - $ref: "#/components/schemas/AzureServicePrincipalFields"
      required:
        - queue_name
      properties:
        connection_string:
          type: string
          description: >
            Service Bus SAS connection string, e.g.
            `Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=<rule>;SharedAccessKey=<key>`.
            Treat as a secret. Never logged or exposed in admin status
            responses. Required in connection-string auth mode. MUST be
            empty when `auth_mode` is `service-principal`.
        service_bus_namespace:
          type: string
          description: >
            Fully-qualified Service Bus namespace, e.g.,
            `myns.servicebus.windows.net` for Public or
            `myns.servicebus.usgovcloudapi.net` for US Government.
            Required when `auth_mode` is `service-principal` (the SAS
            connection string used to encode this for legacy mode). If
            you accidentally include the `sb://` scheme, it is stripped.
          examples:
            - "myns.servicebus.windows.net"
        queue_name:
          type: string
          description: >
            Name (or hierarchical path) of the pre-created Service Bus
            queue. Allowed characters: letters, digits, periods,
            hyphens, underscores, and forward slashes. Maximum 260
            characters.
          pattern: "^[A-Za-z0-9._/\\-]+$"
          maxLength: 260
          examples:
            - "crossguard-relay"
        blob_service_url:
          type: string
          description: >
            Azure Blob Storage service URL for the file attachment
            sidecar. Required when `file_transfer_enabled` is true.
          examples:
            - "https://myaccount.blob.core.windows.net"
        blob_account_name:
          type: string
          description: >
            Storage account name for the blob sidecar. Required when
            `file_transfer_enabled` is true AND `auth_mode` is
            `connection-string` (legacy). MUST be empty when `auth_mode`
            is `service-principal`: the sidecar inherits the parent SP
            credential and uses the same AAD identity for both the
            Service Bus namespace and the blob storage account.
        blob_account_key:
          type: string
          description: >
            Shared access key for the blob sidecar storage account.
            Required when `file_transfer_enabled` is true AND `auth_mode`
            is `connection-string`. MUST be empty when `auth_mode` is
            `service-principal`. Treat as a secret. Never logged or
            exposed in admin status responses.
        blob_container_name:
          type: string
          description: >
            Azure Blob container for file transfers. Required when
            `file_transfer_enabled` is true. Auto-created if it does not
            exist.
          examples:
            - "crossguard-files"
        max_message_size_bytes:
          type: integer
          description: >
            Maximum outbound message payload size. Larger messages are
            rejected at the client boundary. Default 192000 (below the
            Service Bus Standard tier 256 KiB ceiling). Operators on
            Premium tier may raise this up to 100 MiB.
          minimum: 1024
          maximum: 104857600
          default: 192000
        blob_poll_interval_seconds:
          type: integer
          description: >
            How often the inbound side polls the blob sidecar container
            for new file attachments. Only applies when
            `file_transfer_enabled` is true.
          minimum: 1
          default: 15

    # ------------------------------------------------------------------
    # REST API response schemas (reference)
    # ------------------------------------------------------------------
    TeamStatusResponse:
      type: object
      description: >
        Response from GET /api/v1/teams/{team_id}/status. Returns
        initialization state, linked connections, and per-connection
        status for a team.
      properties:
        team_id:
          type: string
        team_name:
          type: string
        team_display_name:
          type: string
        initialized:
          type: boolean
        request_mode:
          type: boolean
          description: >
            True when the calling user is a Team Admin and the plugin
            is in request mode (RestrictToSystemAdmins +
            AllowTeamAdminRequests both enabled). Omitted for System
            Admins.
        linked_connections:
          type: array
          items:
            type: object
            properties:
              direction:
                type: string
              connection:
                type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionStatusEntry"

    ConnectionStatusEntry:
      type: object
      description: >
        Per-connection status within a TeamStatusResponse or
        ChannelStatusResponse. Includes config-derived fields and
        runtime state.
      properties:
        name:
          type: string
        direction:
          type: string
        provider:
          type: string
        linked:
          type: boolean
        orphaned:
          type: boolean
        request_pending:
          type: boolean
          description: >
            True when a link request is pending for this unlinked
            connection. For team status, indicates a Team Admin
            request awaiting System Admin approval. For channel
            status, indicates a Channel Admin request awaiting Team
            Admin approval. Only populated when the plugin is in the
            relevant request mode.
        file_transfer_enabled:
          type: boolean
        file_filter_mode:
          type: string
        file_filter_types:
          type: string
        message_format:
          type: string
          description: >
            Resolved per-connection wire format reported by the status
            endpoint: `xml` or `json` for outbound rows, `auto` for
            inbound rows (which auto-detect from envelope bytes).
        remote_team_name:
          type: string

    ChannelStatusResponse:
      type: object
      description: >
        Response from GET /api/v1/channels/{channel_id}/status.
        Returns connection status for a specific channel, showing
        team-linked connections and any orphaned channel connections.
      properties:
        channel_id:
          type: string
        channel_name:
          type: string
        channel_display_name:
          type: string
        team_name:
          type: string
        channel_request_mode:
          type: boolean
          description: >
            True when the calling user is a Channel Admin operating
            in channel request mode (RestrictToSystemAdmins +
            AllowChannelAdminRequests both enabled, and the caller
            is not a Team Admin or System Admin). Omitted otherwise.
        team_connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionStatusEntry"

    ConnectionRequest:
      type: object
      description: >
        Internal model for a pending connection link request. Created
        when a Team Admin runs init-team in request mode. Stored in
        the KV store keyed by team_id + conn_key.
      properties:
        requester_id:
          type: string
          description: User ID of the Team Admin who submitted the request.
        team_id:
          type: string
        conn_key:
          type: string
          description: >
            Connection key in direction:name format (e.g.
            outbound:relay-to-b).
        post_ids:
          type: array
          items:
            type: string
          description: >
            IDs of the DM posts sent to System Admins. Used to update
            or remove buttons after approval/denial.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the request was created.

    ChannelConnectionRequest:
      type: object
      description: >
        Internal model for a pending channel connection link request.
        Created when a Channel Admin runs init-channel in channel
        request mode. Stored in the KV store keyed by
        channel_id + conn_key. Approved or denied by Team Admins.
      properties:
        requester_id:
          type: string
          description: User ID of the Channel Admin who submitted the request.
        team_id:
          type: string
          description: ID of the team the channel belongs to.
        channel_id:
          type: string
          description: ID of the channel to link.
        conn_key:
          type: string
          description: >
            Connection key in direction:name format (e.g.
            outbound:relay-to-b).
        post_ids:
          type: array
          items:
            type: string
          description: >
            IDs of the DM posts sent to Team Admins. Used to update
            or remove buttons after approval/denial.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the request was created.

    # ------------------------------------------------------------------
    # NATS file transfer protocol (reference)
    # ------------------------------------------------------------------
    NATSFileTransferProtocol:
      type: object
      description: >
        Documents the JetStream Object Store protocol used for file
        attachment relay on NATS connections. File transfer operates
        independently of the core NATS pub/sub text relay. Text messages
        flow through standard publish/subscribe; files flow through
        JetStream Object Store using the same NATS connection.
      properties:
        bucket:
          type: string
          const: "crossguard-files"
          description: >
            JetStream Object Store bucket name. Auto-created on first use
            via CreateOrUpdateObjectStore.
        ttl:
          type: string
          const: "1h"
          description: >
            Object time-to-live. Objects are automatically purged after
            1 hour. No receiver-side deletion is performed because the
            same object may be consumed by multiple receivers (fan-out).
        object_key_format:
          type: string
          description: >
            Object key format: `{postID}/{randomID}` where postID is the
            Mattermost post ID from the originating server and randomID
            is a generated unique identifier.
          examples:
            - "8swgtrrdiff89yj1z33pofo15r/dj7f8k2m41ygsr9w6pxt3nqb4e"
        metadata_headers:
          type: object
          description: >
            Custom NATS headers set on each uploaded object. The receiving
            instance reads these headers to route and attach the file.
          properties:
            X-Post-Id:
              type: string
              description: >
                The originating server's post ID. Used by the receiver to
                look up the local post via its post ID mapping.
              examples:
                - "8swgtrrdiff89yj1z33pofo15r"
            X-Conn-Name:
              type: string
              description: >
                Name of the connection that uploaded the file. Receivers
                filter objects by this header to process only files from
                the matching connection.
              examples:
                - "high-side"
            X-Filename:
              type: string
              description: >
                Original filename of the attachment as it appeared on the
                sending server.
              examples:
                - "report.pdf"
        max_concurrent_ops:
          type: integer
          const: 32
          description: >
            Maximum concurrent file upload/download operations per plugin
            instance. Separate from the text relay semaphore (256 slots).
        max_file_size:
          type: string
          description: >
            Governed by the Mattermost server's FileSettings.MaxFileSize
            configuration. Default is 100 MB. Files exceeding this limit
            are skipped with a log warning.

    # ------------------------------------------------------------------
    # Azure file transfer protocol (reference)
    # ------------------------------------------------------------------
    AzureFileTransferProtocol:
      type: object
      description: >
        Documents the Azure Blob Storage protocol used for file attachment
        relay on Azure connections. Files are uploaded as blobs with
        metadata headers, then discovered and downloaded by the receiving
        instance via polling (15-second interval). Blobs are deleted after
        successful processing. Unlike NATS Object Store, there is no
        automatic TTL; blobs persist until explicitly deleted or managed
        by Azure lifecycle policies.
      properties:
        container:
          type: string
          description: >
            Azure Blob container name, configured via
            `blob_container_name`. Auto-created on startup if it does
            not exist.
          examples:
            - "crossguard-files"
        blob_key_format:
          type: string
          description: >
            Blob key format: `{postID}/{randomID}`, matching the NATS
            Object Store key format for consistency.
          examples:
            - "8swgtrrdiff89yj1z33pofo15r/dj7f8k2m41ygsr9w6pxt3nqb4e"
        metadata_key:
          type: string
          const: "crossguard_headers"
          description: >
            Blob metadata key that stores file routing headers. The value
            is a Base64-encoded JSON object containing the same header
            fields used by NATS (X-Post-Id, X-Conn-Name, X-Filename).
        metadata_value_format:
          type: object
          description: >
            JSON structure stored (Base64-encoded) in the
            `crossguard_headers` blob metadata key.
          properties:
            headers:
              type: object
              description: Map of header name to value.
              properties:
                X-Post-Id:
                  type: string
                  description: Originating server's post ID.
                X-Conn-Name:
                  type: string
                  description: Connection name that uploaded the file.
                X-Filename:
                  type: string
                  description: Original filename of the attachment.
        poll_interval:
          type: string
          const: "15s"
          description: >
            Interval between blob container list operations. The receiver
            polls for new blobs every 15 seconds.
        cleanup:
          type: string
          description: >
            Blobs are deleted immediately after successful processing by
            the receiver. Failed downloads or handler errors leave the
            blob in place for retry on the next poll cycle. There is no
            automatic TTL; consider Azure Storage lifecycle management
            policies for production deployments.
        max_file_size:
          type: string
          description: >
            Same as NATS: governed by the Mattermost server's
            FileSettings.MaxFileSize configuration. Default is 100 MB.
        message_size_limit:
          type: integer
          const: 48000
          description: >
            Azure Queue Storage has a 64 KB message size limit. Messages
            are Base64-encoded before enqueuing, so the effective payload
            limit is 48,000 bytes. Messages exceeding this limit are
            truncated (text is shortened to fit).
